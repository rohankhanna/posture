# posture — trust policy (versioned, dated, auditable)
#
# This is trust AS DATA, not trust as code. Changing who is authoritative, in
# what order, or what to do if a source goes silent = editing this file +
# bumping `version`. The engine reads it; it never hardcodes trust.
#
# Produced / re-evaluated by the `source-alignment` repo against evidence on a
# cadence. Initial values are conservative working assumptions, not verdicts.

version: "2026-08-06.3"
supersedes: "2026-08-06.2"
dated: 2026-08-06
rationale: |
  Initial skeleton policy (2026-08-01.1): NVD is the CVE spine today — a
  foreign (US NIST) coordinate system that over-reports for backport distros
  (false-alarm); a vendor observer, when present, overrides it. MITRE CVE id
  assignment nearly lapsed in 2024, so the spine is kept redundant (crosswalk).
  The other five axes have no wired observer yet -> they are UNKNOWN and loud,
  never silently clean. Bias directions are working assumptions pending the
  alignment exercise; re-evaluate with evidence.
  2026-08-02.1: first real VENDOR observer — ubuntu_tracker on the
  vulnerability axis, authoritative for Ubuntu kernel CVEs (NVD records them
  with no fix boundary, over-reporting unknown-fix). order 5 < nvd 10 so the
  engine runs it LAST and it overrides NVD on the same CVE key. Candidate CVEs
  come from the device (cve_candidates), not the NVD pass — the fan-out stays
  pure. debian/apple vendor observers follow the same shape when wired.
  2026-08-02.2: the remaining vendor observers — debian_tracker (Debian
  security-tracker bulk JSON; status mapping resolved/open/undetermined, device
  assumed fully-updated latest) and apple_advisory (Apple security advisories;
  iOS/iPadOS/macOS CVE->fixed_in, device_version>=fixed_in->patched). Same
  shape + override-by-policy-order as ubuntu_tracker. The vulnerability axis
  now has three real vendor observers covering the common distros; the other
  five axes remain stubbed/UNKNOWN until wired.
  2026-08-02.3: first real observers on previously-STUBBED axes — cyclonedx_sbom
  (inventory: reads a CycloneDX SBOM the device supplies, emits one present
  Verdict per component keyed <name>@<version>; the measured floor) and
  cis_checker (configuration: runs a bundled CIS-style benchmark against a
  device config snapshot, emits fail/pass per check id; missing setting = fail).
  Each turns its axis from loud UNKNOWN into a real status when the device
  supplies input, and is an honest no-op (UNKNOWN) otherwise. exposure/threat/
  trust remain stubbed.
  2026-08-06.1: pruned the redundant sbom/cis stub policy entries now that
  cyclonedx_sbom (inventory) and cis_checker (configuration) are wired real
  observers; the stub registrations were removed to stop duplicate axis
  entries. exposure/threat/trust remain stubbed.
  2026-08-06.2: the spine is the alias↔alias graph, not a swappable join key.
  cve is one peer among many (ghsa/osv/rustsec/pysec/go/…), NOT a primary key
  and NOT rebindable. The `spine.primary_key`/`spine.role` fields (the old
  CVE-replacement rebind mechanism) are retired; the crosswalk table is renamed
  cve-centric (cve,alias,kind) -> alias-centric (defect_id,alias,kind) so a non-cve
  defect with no cve anchors as a first-class peer. Ingestion peers (cvelistV5
  back-fill + OSV + GHSA + CISA KEV) are being wired on this foundation. No
  observer order/bias changes; the observer layer is unaffected.
  2026-08-06.3: the last three stubbed axes are now wired with REAL observers —
  local_exposure (exposure: reads a local socket capture the device supplies,
  emits exposed/closed per proto/port; loopback bind = closed, wildcard or
  non-loopback or missing bind = exposed; false-safe), kev (threat: overlays
  the device's cve_candidates against a CISA KEV cve_id set the device supplies,
  emits targeted/clear per CVE; no KEV overlay supplied = honest no-op, NOT
  all-clear; an empty set = all-clear), and sigverify (trust: verifies a
  supplied signature against a supplied public key per artifact via the
  cryptography lib, emits trusted/untrusted; unverifiable = untrusted, never
  skipped). Each turns its axis from loud UNKNOWN into a real status when the
  device supplies input, and is an honest no-op (UNKNOWN) otherwise. The three
  stub registrations + stubs.py are gone. No axis is left at a stub. Heavier
  credentialed variants (real Shodan external view, MISP/STIX IOC feeds,
  SLSA/cosign keyless attestation) are future, separately-id'd observers, not
  replacements. No observer order changes; each new observer is order 10 (no
  override partner on its axis).

observers:
  nvd:
    axes: [vulnerability]
    weight: high
    bias: false-alarm          # over-reports for backport distros (wrong yardstick)
    order: 10
    conditions:
      - "backport distros: defer to a vendor observer when one is present"
      - "header-only apiKey (never query string) — the run-#10 wipe root cause"
  ubuntu_tracker:
    axes: [vulnerability]
    weight: high
    bias: false-safe           # vendor authoritative; clears NVD false positives
    order: 5                   # < nvd -> runs last -> overrides on the CVE key
    conditions:
      - "Ubuntu hosts only: device supplies cve_candidates + ubuntu_release + ubuntu_packages"
      - "Needs triage / DNE / Not in release / absent -> no verdict (NVD stands)"
      - "candidate CVEs are a device input (the fan-out is pure; no peeking at NVD's verdicts)"
  debian_tracker:
    axes: [vulnerability]
    weight: high
    bias: false-safe           # vendor authoritative; clears NVD false positives
    order: 5                   # < nvd 10 -> runs last -> overrides on the CVE key
    conditions:
      - "Debian hosts only: device supplies cve_candidates + debian_release + debian_packages"
      - "undetermined / release absent / CVE absent -> no verdict (NVD stands)"
      - "device assumed fully-updated latest; verdict is a status mapping, not an installed-vs-fixed compare"
      - "candidate CVEs are a device input (the fan-out is pure; no peeking at NVD's verdicts)"
  apple_advisory:
    axes: [vulnerability]
    weight: high
    bias: false-safe           # vendor authoritative; clears NVD's false-clean skips
    order: 5                   # < nvd 10 -> runs last -> overrides on the CVE key
    conditions:
      - "Apple hosts only: device supplies cve_candidates + apple_product + os_version"
      - "CVE not in Apple's feed -> no verdict (NVD stands)"
      - "candidate CVEs are a device input (the fan-out is pure; no peeking at NVD's verdicts)"
  local_exposure:
    axes: [exposure]
    weight: medium
    bias: false-safe           # a missing bind is assumed exposed, not closed
    order: 10
    conditions:
      - "LOCAL only: reads device['exposure'] (inline list of {proto,port,bind,service?}) or device['exposure_path'] (local JSON file); no network"
      - "loopback bind (127/8, ::1, localhost) -> closed; wildcard / non-loopback / missing bind -> exposed (false-safe)"
      - "no exposure surface supplied -> honest no-op (zero verdicts); axis falls to UNKNOWN via loud degradation"
      - "one Verdict per socket keyed proto/port; severity HIGH on a dangerous exposed port (ssh/rdp/telnet + common DBs), else MEDIUM; closed -> None"
  kev:
    axes: [threat]
    weight: high
    bias: false-safe           # CISA lists only confirmed-exploited -> may miss some
    order: 10
    conditions:
      - "device supplies cve_candidates + a KEV cve_id set (device['kev'] inline list or device['kev_path'] local JSON file); the client gets the set from the imported spine's kev.jsonl"
      - "CVE in KEV set -> targeted (HIGH); not in set -> clear"
      - "no cve candidates, OR candidates with NO KEV overlay supplied -> honest no-op (axis UNKNOWN); an explicitly-empty KEV set -> all clear"
      - "this is the territory device-assessment observer (emits verdicts); distinct from the CI ingest overlay sources/kev.py (populates store.kev, never emits verdicts)"
  sigverify:
    axes: [trust]
    weight: high
    bias: false-safe           # an unverifiable artifact is untrusted, never skipped
    order: 10
    conditions:
      - "LOCAL only: reads device['artifacts'] (inline list of {id,payload,signature,public_key,algorithm?}) or device['artifacts_path'] (local JSON file); no network"
      - "verifies signature over payload under public_key via the cryptography lib; ed25519 (default) or rsa-pss; PEM or raw keys, hex/base64 signatures"
      - "valid -> trusted; invalid or missing payload/signature/public_key or unsupported algorithm -> untrusted (HIGH; false-safe)"
      - "no artifacts supplied -> honest no-op (zero verdicts); axis falls to UNKNOWN via loud degradation"
      - "SLSA/cosign keyless attestation is a future separately-id'd 'slsa' observer; this is honest generic signature verification"
  # First REAL observers on previously-stubbed axes (turn UNKNOWN into a real
  # status when the device supplies input; honest no-op / UNKNOWN otherwise).
  cyclonedx_sbom:
    axes: [inventory]
    weight: high
    bias: neutral             # the SBOM is the measured floor; no over/under-report direction
    order: 10
    conditions:
      - "LOCAL only: reads device['sbom'] (inline CycloneDX dict) or device['sbom_path'] (local JSON file); no network"
      - "no SBOM supplied -> honest no-op (zero verdicts); axis falls to UNKNOWN via loud degradation"
      - "one present Verdict per named component, keyed <name>@<version>; nameless components skipped"
  cis_checker:
    axes: [configuration]
    weight: medium
    bias: false-safe          # community/vendor checks may understate
    order: 10
    conditions:
      - "Linux/server hosts: device supplies a 'config' dict (setting->value)"
      - "missing setting -> fail (a missing control is not a pass)"
      - "no config dict supplied -> honest no-op (axis stays UNKNOWN, not clean)"
      - "device may scope checks via 'cis_checks' list; default = whole benchmark"

degradation:
  nvd:
    if_silent_for_days: 14
    fallback: [osv, vendor_advisory]
  mitre_cve:
    if_silent_for_days: 30     # the 2024 near-lapse
    fallback: [ghsa, osv_id]

spine:
  # The spine is the alias↔alias graph (see spine.py): every defect_id is a peer,
  # cve is NOT a primary key and NOT rebindable. There is no `primary_key` or
  # `role` here anymore — the old CVE-replacement rebind mechanism is retired
  # (the alias graph keeps old joins resolving without a rebind). `crosswalk` is
  # advisory only: the alias-kind pairs the operator declares they maintain.
  crosswalk:
    - [cve, ghsa]
    - [cve, usn]
    - [cve, dsa]