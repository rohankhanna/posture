name: CI
# CI = ingestion (public + signed + auditable MAP). No device data here.
# The map/territory split made concrete: this workflow feeds & enriches the
# catalog (the spine, the MAP); clients git clone + verify + `posture assess`
# locally over their private fleet (the TERRITORY). No feeding or enrichment
# runs from anyone's local machine.

on:
  schedule:
    # Every 6h at :07 UTC while private (00:07, 06:07, 12:07, 18:07) — off-zero
    # minute, off-top-of-hour (docs/sources.md item 7: high-load may delay/drop
    # round-number cron). Switch to "7 * * * *" (hourly) once the repo is public.
    # The periodic push is also the keepalive against GitHub's 60-day auto-disable
    # of scheduled workflows.
    - cron: "7 */6 * * *"
  push:
    branches: [main]
    paths:
      - '.github/workflows/spine.yml'
      - 'posture/**'
      - 'pyproject.toml'
      # NOTE: 'spine/**' intentionally NOT listed — the bot's own spine commit
      # must not re-trigger this workflow (infinite loop).
  workflow_dispatch:        # manual "run now"

# Fork PRs never reach the secrets (NVD_API_KEY is withheld from fork-PR runs by
# GitHub), and no `pull_request` trigger is registered at all. The secret + cosign
# steps below are ALSO guarded `if: github.event_name != 'pull_request'` as a
# belt-and-braces check.
permissions:
  contents: write           # git push spine/ back to this repo
  id-token: write           # cosign keyless via GitHub OIDC
  actions: read             # restore cache

env:
  DB_PATH: ${{ github.workspace }}/cache/posture.db
  # POSTURE_CVELIST_DIR is the PARENT of the cvelistV5 clone (mirrors the default
  # ~/.local/share/posture/cvelist -> cvelistV5/). The cache holds this parent.
  CLONE_DIR: ${{ github.workspace }}/cache/cvelist
  POSTURE_CVELIST_DIR: ${{ github.workspace }}/cache/cvelist
  # POSTURE_GHSA_DIR is the PARENT of the advisory-database clone (mirrors the
  # default ~/.local/share/posture/ghsa -> advisory-database/).
  GHSA_DIR: ${{ github.workspace }}/cache/ghsa
  POSTURE_GHSA_DIR: ${{ github.workspace }}/cache/ghsa

jobs:
  # Skip-if-already-running guard. Native workflow concurrency with
  # cancel-in-progress: false QUEUES; we want to SKIP a run when an ingest is
  # already in flight. This guard queries the runs API and exports should_run;
  # the ingest job gates on it. The job-level concurrency on ingest (below) is a
  # safety net (queue, never cancel) for the rare race where two guards both see
  # "idle" — the guard makes queueing the rare case, not the rule.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read          # `gh run list` needs actions: read on the auto token
      contents: none
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      active_other: ${{ steps.check.outputs.active_other }}
    steps:
      - name: Detect in-flight ingest (skip, do not queue)
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Count spine runs that are not this run and not completed (in_progress,
          # queued, waiting, pending, requested, ...). Any such run means an
          # ingest is already in flight (or about to start) -> skip, do not queue.
          active=$(gh run list --workflow spine.yml --repo "$GITHUB_REPOSITORY" \
            --json databaseId,status --limit 50 \
            | jq -r --arg self "$GITHUB_RUN_ID" \
               '[ .[] | select( (.databaseId|tostring) != $self
                              and (.status != "completed") ) ] | length')
          echo "active_other=$active" >> "$GITHUB_OUTPUT"
          if [ "$active" -gt 0 ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping ingest: $active in-flight spine run(s) detected."
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "No in-flight spine run; proceeding to ingest."
          fi

  ingest:
    runs-on: ubuntu-latest   # ephemeral + safe (no PR-pwn on a public repo)
    timeout-minutes: 30
    needs: [guard]
    if: ${{ needs.guard.outputs.should_run == 'true' }}
    # Safety net for the guard's rare race: if two guards both see "idle", the
    # second ingest queues (never cancel — mirrors the engine's no-wipe rule; a
    # killed run mid-fetch could leave the cached posture.db half-written).
    concurrency:
      group: spine-ingest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install posture
        run: pip install .
        # git + curl are preinstalled on ubuntu-latest (external subprocess deps
        # not declared in pyproject.toml).

      # --- persistent state across runs (else the stream cursor resets and
      #     stream would re-bootstrap every run, producing nothing) ---
      # cvelist: fixed key — a blobless base clone; `git fetch` updates it each
      # run on the runner, so an exact-hit-skip-save is fine (the cached base is
      # refreshed in-place; daily restore access keeps the 7-day retention alive).
      - name: Cache cvelistV5 clone (restore + save)
        uses: actions/cache@v4
        with:
          path: ${{ env.CLONE_DIR }}
          key: cvelist-blobless-v1
          restore-keys: cvelist-blobless-

      # advisory-database: fixed-key blobless clone for the GHSA peer (same
      # pattern as cvelist — `git fetch` refreshes it in place each run).
      - name: Cache advisory-database clone (restore + save)
        uses: actions/cache@v4
        with:
          path: ${{ env.GHSA_DIR }}
          key: ghsa-blobless-v1
          restore-keys: ghsa-blobless-

      # posture.db: run-id-unique key so the post-run save ALWAYS writes a fresh
      # entry (a fixed key would exact-hit-skip-save and the stream cursor —
      # which lives in posture.db via store.set_state — would revert every run,
      # making stream re-bootstrap forever and the spine stay empty). restore-keys
      # prefix-restores the most recent prior db. `if: always()` so a failed run
      # still caches its partial db (no-wipe: next run resumes, not restarts).
      - name: Cache posture.db (restore + save)
        if: always()
        uses: actions/cache@v4
        with:
          path: ${{ env.DB_PATH }}
          key: posture-db-v1-${{ github.run_id }}
          restore-keys: posture-db-v1-
          enableCrossOsArchive: true

      - name: Stream (MITRE detect — skeletons only, only-adds)
        run: |
          mkdir -p cache
          posture stream --db "$DB_PATH"

      # --- aggregator peers (the spine is ALL defects, cve one peer among many) -
      # Back-fill the cvelistV5 back-catalog (history the forward-only stream
      # can't take). Self-disables after the first full run (BACKFILL_DONE_KEY),
      # so daily CI calls it cheaply as a no-op thereafter. Only-adds skeletons
      # (enrich_state='mitre') -> they join the refresh's pending pool below.
      - name: Backfill (cvelistV5 back-catalog — skeletons, self-disables when done)
        run: |
          mkdir -p cache
          posture backfill --cap 5000 --db "$DB_PATH"

      # GHSA peer (self-enriched OSV rows; cap-resumed backfill then incremental).
      # No secret — github/advisory-database is public (CC-BY 4.0).
      - name: Ingest GHSA (GitHub Advisory Database peer)
        run: |
          posture ingest ghsa --cap 5000 --db "$DB_PATH"

      # OSV peer (the GCS hub; many ecosystems emit OSV schema — highest leverage).
      # No secret — osv-vulnerabilities GCS is public, rate-friendly.
      - name: Ingest OSV (osv.dev hub peer)
        run: |
          posture ingest osv --cap 5000 --db "$DB_PATH"

      # CISA KEV overlay (exploitability_signal; CVE-keyed full refresh, ~1,660
      # rows). No secret — the static catalog JSON is public.
      - name: Ingest KEV (CISA Known Exploited Vulnerabilities overlay)
        run: |
          posture ingest kev --db "$DB_PATH"

      # Apple advisory fix-version overlay (apple_fixes). Apple's own advisories
      # are authoritative for iOS/iPadOS/macOS fix versions (NVD's Apple coverage
      # is thin: it records the CPE but often no version range -> the NVD observer
      # silently skips most Apple CVEs). Per-product full refresh over Apple's
      # live security-releases index. No secret — Apple's support pages are
      # public. `--history` is OFF in CI by default (the Wayback-historical
      # recovery path adds many fetches per product; enable it on a separate,
      # rate-budgeted cadence if pre-index CVE coverage is wanted in the spine).
      - name: Ingest Apple (advisory fix-version overlay)
        run: |
          posture ingest apple --db "$DB_PATH"

      - name: Refresh (catalog-only; NO devices, NO verdicts)
        if: github.event_name != 'pull_request'
        env:
          # header-only apiKey (nvd_cve.py:253,257) — the run-#10 fleet-wipe guard.
          # Never travels in the query string; CI just injects it as an env var.
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          posture refresh --no-devices --cap 200 --db "$DB_PATH"
          # 'verdicts upserted 0 across 0 device(s)' is the proof no territory was touched.

      # DB-only course-correction (cheap; raise proposals/signals but apply no
      # trust). discover writes candidates — which ARE part of the exported spine.
      - name: Course-correct (DB-only)
        run: |
          posture monitor run --db "$DB_PATH"
          posture repair reconcile --db "$DB_PATH"
          posture discover --db "$DB_PATH"

      - name: Export spine (sharded JSONL + manifest)
        run: posture spine export --db "$DB_PATH" --out .

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      - name: Sign manifest (cosign keyless via GitHub OIDC)
        if: github.event_name != 'pull_request'
        env:
          COSIGN_EXPERIMENTAL: "1"   # keyless OIDC mode (no key material to manage)
        run: |
          cosign sign-blob --yes \
            --output-signature spine/state.sig \
            --output-certificate spine/state.crt \
            spine/manifest.json

      - name: Commit + push spine/
        run: |
          git config user.name  "posture-ci[bot]"
          git config user.email "actions@github.com"
          git add -A spine/
          if git diff --cached --quiet; then
            echo "no spine changes — keepalive commit only (resets 60-day auto-disable)"
            git commit --allow-empty -m "spine: keepalive $(date -u +%FT%TZ)"
          else
            git commit -m "spine: $(date -u +%FT%TZ)"
          fi
          git push
        # GPG-signed commits (the history layer) are deferred — this first cut
        # ships the sigstore state.sig snapshot attestation only (docs/sources.md
        # item 6 "both"; the signature layer is the non-negotiable one).

  # --- Credentialed lane scaffold --------------------------------------------
  # Runs gated vendor observers (SAP/Snyk/Tenable/Qualys/Cisco/VMware) into a
  # SEPARATE PRIVATE repo (rohankhanna/posture-cred), never into this repo's
  # history — so the later public flip of this repo can't leak credentialed
  # content (some of which, e.g. SAP, is non-redistributable).
  #
  # Dormant by default (vars.CREDENTIALED_READY != 'true') until the first vendor
  # observer is wired + its secret added. Wiring order = credential friction:
  # Cisco openVuln + VMware (free reg/account) -> Snyk/Tenable/Qualys (commercial)
  # -> SAP (contract, non-redistributable, confined here).
  credentialed:
    needs: ingest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ vars.CREDENTIALED_READY == 'true' && needs.ingest.result == 'success' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install posture
        run: pip install .

      - name: Restore posture.db cache
        uses: actions/cache@v4
        with:
          path: ${{ env.DB_PATH }}
          key: posture-db-v1-cred   # never saved by this job; forces a prefix restore
          restore-keys: posture-db-v1-
          enableCrossOsArchive: true

      # TODO(future): run credentialed vendor observers here (none wired yet).
      # Each adds: a new Observer declaring its key_kind + a repo secret for its
      # credential + provenance stamp 'credentialed'. Non-redistributable output
      # stays in posture-cred (this job), never in the public repo.
      - name: Export credentialed spine (empty until observers wired)
        run: |
          mkdir -p spine
          posture spine export --db "$DB_PATH" --out .

      - name: Check out private posture-cred
        uses: actions/checkout@v4
        with:
          repository: rohankhanna/posture-cred
          path: spine-cred
          ssh-key: ${{ secrets.POSTURE_CRED_DEPLOY_KEY }}
      - name: Commit + push credentialed spine
        run: |
          rm -rf spine-cred/spine
          cp -a spine spine-cred/spine
          cd spine-cred
          git config user.name  "posture-ci[bot]"
          git config user.email "actions@github.com"
          git add -A spine/
          git commit -m "credentialed spine: $(date -u +%FT%TZ)" || true
          git push || echo "nothing to push"