[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "posture"
version = "0.1.0"
description = "A source-agnostic, axis-based posture pillar with monitored trust (working title)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "PyYAML>=6.0",
  "packaging>=23",
]

[project.scripts]
posture = "posture.cli:main"

[tool.setuptools]
packages = ["posture", "posture.sources"]

[tool.setuptools.package-data]
posture = ["fixtures/*.json", "fixtures/*.yaml", "policy/*.yaml"]